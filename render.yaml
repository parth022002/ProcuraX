services:
  - type: web
    name: procurax-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt && python scripts/generate_synthetic_data.py --scale small && python -c "import sys; sys.path.insert(0, 'backend'); from app.services.risk_model.model import train_and_register_baseline; from pathlib import Path; train_and_register_baseline(Path('data/generated'), Path('models/registry'))"
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
