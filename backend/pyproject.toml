[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procurax-api"
version = "0.1.0"
description = "ProcuraX supplier-disruption decision-intelligence API scaffold"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.4,<3.0",
  "pandas>=2.2,<4.0",
  "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10.0", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0"]
database = ["sqlalchemy>=2.0,<3.0", "psycopg[binary]>=3.2,<4.0", "alembic>=1.13,<2.0", "pgvector>=0.3,<1.0"]
ml = ["scikit-learn>=1.5,<2.0", "xgboost>=2.1,<4.0", "mlflow>=2.17,<4.0", "shap>=0.46,<1.0", "evidently>=0.4,<1.0"]
rag = ["pypdf>=5.0,<7.0", "sentence-transformers>=3.2,<6.0"]
optimisation = ["ortools>=9.11,<10.0"]
observability = ["opentelemetry-api>=1.28,<2.0", "opentelemetry-sdk>=1.28,<2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
